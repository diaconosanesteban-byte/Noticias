name: Actualizar titulares

on:
  schedule:
    # Cada hora, en el minuto 7 (evita la sobrecarga habitual en GitHub Actions al minuto 0).
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Generar titulares y página
        run: npm run build

      - name: Publicar cambios si hay titulares nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/titulares.json public/index.html
          if git diff --cached --quiet; then
            echo "Sin cambios: no hay titulares nuevos."
          else
            git commit -m "Actualizar titulares ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
