name: Actualizar titulares

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Generar titulares y página
        run: npm run build
        env:
          TZ: Europe/Madrid

      - name: Guardar cambios si hay titulares nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/titulares.json public/index.html
          if git diff --cached --quiet; then
            echo "Sin cambios: no hay titulares nuevos."
          else
            git commit -m "Actualizar titulares ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi

      - name: Preparar página para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4
